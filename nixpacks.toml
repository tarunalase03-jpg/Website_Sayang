[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci || npm install",
    "npm run build"
]

[start]
cmd = "mkdir -p database && touch database/database.sqlite && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
